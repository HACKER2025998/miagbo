components:
  schemas:
    ActiveRefresh:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    ActiveRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    AlertZone:
      type: object
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        radius:
          type: integer
          maximum: 20000
          minimum: 100
        consent_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - consent_at
      - latitude
      - longitude
    AlertZoneRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        radius:
          type: integer
          maximum: 20000
          minimum: 100
        consent:
          type: boolean
          writeOnly: true
      required:
      - consent
      - latitude
      - longitude
    BroadcastInputRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 2000
        role:
          $ref: '#/components/schemas/BroadcastRoleEnum'
      required:
      - message
      - role
      - title
    BroadcastRoleEnum:
      enum:
      - all
      - client
      - vendor
      type: string
      description: |-
        * `all` - all
        * `client` - client
        * `vendor` - vendor
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        parent:
          type: integer
          nullable: true
      required:
      - id
      - name
    DeviceRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 300
          pattern: ^(ExpoPushToken|ExponentPushToken)\[[A-Za-z0-9_-]+\]$
        platform:
          $ref: '#/components/schemas/PlatformEnum'
      required:
      - platform
      - token
    Exception:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        closed:
          type: boolean
        start:
          type: string
          format: time
          nullable: true
        end:
          type: string
          format: time
          nullable: true
      required:
      - date
      - id
    ExceptionRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        closed:
          type: boolean
        start:
          type: string
          format: time
          nullable: true
        end:
          type: string
          format: time
          nullable: true
      required:
      - date
    FavoriteInputRequest:
      type: object
      properties:
        vendor:
          type: integer
          minimum: 1
      required:
      - vendor
    Hour:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        weekday:
          type: integer
          maximum: 6
          minimum: 0
        start:
          type: string
          format: time
        end:
          type: string
          format: time
      required:
      - end
      - id
      - start
      - weekday
    HourRequest:
      type: object
      properties:
        weekday:
          type: integer
          maximum: 6
          minimum: 0
        start:
          type: string
          format: time
        end:
          type: string
          format: time
      required:
      - end
      - start
      - weekday
    LoginInputRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - identifier
      - password
    ModerationEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - À valider
        * `approved` - Validé
        * `rejected` - Rejeté
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
